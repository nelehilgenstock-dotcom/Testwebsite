Technische Anforderungen:
Verwende HTML5 und CSS3 (CSS im <style>-Block oder separate Datei).
Die Seite muss responsive sein (funktioniert auf Desktop, Tablet und Smartphone).
Nutze ein modernes, minimalistisches Design mit klarer Typografie.
Farbschema: technologisch/modern (z. B. Blau, Weiß, Grau).
Verwende Flexbox oder CSS Grid für Layout.
Baue eine Navigation mit Sprunglinks ein.
Verwende Icons oder einfache Illustrationen (z. B. Font Awesome oder SVG).

Wichtig:
Gib den kompletten HTML-Code in einer Datei aus, der direkt gespeichert und im Browser geöffnet werden kann.
Kommentiere wichtige Bereiche im Code.
Verwende sinnvolle Klassen und Struktur.
